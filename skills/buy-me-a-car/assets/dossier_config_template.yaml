# ============================================================
INTERNAL_ANCHOR_PARA: |
  This dealer concurrently lists a 2024 Forester Standard at $25,000 sales /
  $26,900 OTD. The implied fair spread between Standard and Limited (accounting
  for trim premium $2-3k less mileage delta $1-1.5k) is $1-2k, NOT the $5k
  difference in the asking prices. Implied fair Limited sales price is
  $26,500-$27,500, equivalent to $28,500-$29,500 OTD. The proposed $30,000 OTD
  sits at the upper end of this fair range, leaving the dealer reasonable
  margin while reflecting the buyer's strong terms.

